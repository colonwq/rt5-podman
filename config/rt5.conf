<VirtualHost *:8080>
    ### Optional apache logs for RT
    # Ensure that your log rotation scripts know about these files
    # ErrorLog /opt/rt5/var/log/apache2.error
    # TransferLog /opt/rt5/var/log/apache2.access
    # LogLevel debug

    AddDefaultCharset UTF-8

    # Host reverse proxy sends X-Forwarded-Proto; RT uses HTTPS for cookies/redirects.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=1

    ScriptAlias / /opt/rt5/sbin/rt-server.fcgi/

    DocumentRoot "/opt/rt5/share/html"
    <Location />
        Require all granted
        Options +ExecCGI
        AddHandler fcgid-script fcgi
    </Location>

    # rt-mailgate POSTs raw MIME multipart; default ModSecurity rules false-positive.
    <Location "/REST/1.0/NoAuth/mail-gateway">
        <IfModule mod_security2.c>
            SecRuleRemoveById 200002 200003
        </IfModule>
    </Location>
</VirtualHost>

