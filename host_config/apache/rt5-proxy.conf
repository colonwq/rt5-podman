# Reverse proxy for Request Tracker (rootless rt5 quadlet on localhost:8080).
#
# Install on the RHEL host:
#   sudo cp rt5-proxy.conf /etc/httpd/conf.d/
#   sudo apachectl configtest
#   sudo systemctl reload httpd
#
# Required modules (RHEL 9):
#   sudo dnf install -y mod_ssl
#   # mod_proxy, mod_proxy_http, mod_headers are in the base httpd package
#
# Set SSLCertificateFile and SSLCertificateKeyFile below to your site certificate.
# Listen 443 is normally defined in /etc/httpd/conf.d/ssl.conf when mod_ssl is enabled.

<VirtualHost *:443>
    ServerName rt.example.com

    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/rt.example.com.crt
    SSLCertificateKeyFile /etc/pki/tls/private/rt.example.com.key
    # SSLCertificateChainFile /etc/pki/tls/certs/rt.example.com-chain.crt

    ErrorLog logs/rt5-proxy-error_log
    CustomLog logs/rt5-proxy-access_log combined

    ProxyPreserveHost On

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    SetEnvIf X-Forwarded-Proto "https" HTTPS=1

    ProxyPass / http://127.0.0.1:8080/ retry=0
    ProxyPassReverse / http://127.0.0.1:8080/
    ProxyPassReverseCookiePath / /

    # RT ticket URLs may contain encoded slashes.
    AllowEncodedSlashes NoDecode
</VirtualHost>
