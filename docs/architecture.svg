<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 830" role="img" aria-labelledby="title desc">
  <title id="title">RT5 Podman Quadlet Architecture</title>
  <desc id="desc">Host Postfix and Apache with mariadb, rt5, and exim containers on rt5-net</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 20px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
      .label { font: 600 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
      .text { font: 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: #334155; }
      .small { font: 11px system-ui, -apple-system, Segoe UI, sans-serif; fill: #475569; }
      .mono { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .host-box { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .net-box { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.5; stroke-dasharray: 8 5; }
      .container-box { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
      .apache-box { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
      .line { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .line-plain { stroke: #64748b; stroke-width: 1.2; fill: none; }
      .divider { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .caption { font: italic 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="920" height="830" fill="#f8fafc"/>

  <text x="460" y="34" text-anchor="middle" class="title">RT5 on Podman Quadlets</text>

  <!-- Internet -->
  <ellipse cx="460" cy="72" rx="92" ry="24" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <text x="460" y="76" text-anchor="middle" class="label">Internet / LAN</text>

  <!-- HTTPS branch to Host Apache -->
  <path d="M 400 96 L 135 96 L 135 168" class="line"/>
  <text x="220" y="112" text-anchor="middle" class="mono">HTTPS :443 (ServerName)</text>

  <line x1="460" y1="96" x2="460" y2="118" class="line"/>

  <text x="460" y="134" text-anchor="middle" class="mono">SMTP :25 ($myhostname)</text>

  <line x1="460" y1="142" x2="460" y2="162" class="line"/>

  <!-- Host Apache -->
  <rect x="40" y="168" width="190" height="72" rx="8" class="apache-box"/>
  <text x="135" y="192" text-anchor="middle" class="label">Host Apache</text>
  <text x="135" y="212" text-anchor="middle" class="small">HTTPS reverse proxy</text>
  <text x="135" y="230" text-anchor="middle" class="mono">https://rt.example.com</text>

  <!-- Host Postfix -->
  <rect x="300" y="168" width="320" height="148" rx="10" class="host-box"/>
  <text x="460" y="192" text-anchor="middle" class="label">Host Postfix</text>
  <text x="460" y="214" text-anchor="middle" class="text">transport map:</text>
  <text x="460" y="232" text-anchor="middle" class="mono">rt@rt.example.com</text>
  <text x="460" y="248" text-anchor="middle" class="mono">rt-comment@rt.example.com</text>
  <line x1="460" y1="258" x2="460" y2="276" class="line-plain"/>
  <polygon points="455,276 465,276 460,286" fill="#334155"/>
  <text x="460" y="304" text-anchor="middle" class="text">relay to 127.0.0.1:2525</text>

  <line x1="460" y1="316" x2="460" y2="348" class="line"/>

  <!-- Host / network labels -->
  <text x="130" y="372" text-anchor="middle" class="caption">Host published ports</text>
  <line x1="40" y1="378" x2="220" y2="378" class="divider"/>
  <text x="700" y="372" text-anchor="middle" class="caption">podman network "rt5-net" (DNS on)</text>
  <line x1="560" y1="378" x2="880" y2="378" class="divider"/>

  <!-- rt5-net boundary (containers + 10px padding) -->
  <rect x="320" y="420" width="280" height="320" rx="12" class="net-box"/>
  <text x="460" y="438" text-anchor="middle" class="label">rt5-net</text>

  <!-- exim -->
  <rect x="330" y="430" width="260" height="88" rx="8" class="container-box"/>
  <text x="460" y="454" text-anchor="middle" class="label">exim :2525</text>
  <text x="460" y="474" text-anchor="middle" class="small">rt-mailgate</text>
  <text x="460" y="492" text-anchor="middle" class="mono">colonwq/rt-mailgate:510-4</text>
  <text x="268" y="468" text-anchor="end" class="mono">127.0.0.1:2525</text>
  <line x1="278" y1="468" x2="328" y2="468" class="line"/>

  <line x1="460" y1="518" x2="460" y2="538" class="line"/>
  <text x="500" y="532" class="small">HTTP rt-mailgate</text>

  <!-- rt5 -->
  <rect x="330" y="544" width="260" height="88" rx="8" class="container-box"/>
  <text x="460" y="568" text-anchor="middle" class="label">rt5 :8080 (Apache + RT)</text>
  <text x="460" y="588" text-anchor="middle" class="mono">colonwq/rt5:510-5</text>
  <text x="268" y="582" text-anchor="end" class="mono">127.0.0.1:8080</text>
  <line x1="278" y1="582" x2="328" y2="582" class="line"/>

  <!-- Host Apache → rt5 (over rt5-net, into rt5 left side) -->
  <path d="M 135 240 L 135 430 L 305 430 L 305 588 L 330 588" class="line"/>

  <line x1="460" y1="632" x2="460" y2="652" class="line"/>
  <text x="500" y="646" class="small">MySQL :3306</text>

  <!-- mariadb -->
  <rect x="330" y="658" width="260" height="72" rx="8" class="container-box"/>
  <text x="460" y="682" text-anchor="middle" class="label">mariadb :3306</text>
  <text x="460" y="702" text-anchor="middle" class="mono">mariadb:lts-ubi</text>
  <text x="268" y="690" text-anchor="end" class="mono">127.0.0.1:3306</text>
  <line x1="278" y1="690" x2="328" y2="690" class="line"/>

  <!-- Outbound mail -->
  <rect x="120" y="770" width="680" height="44" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
  <text x="460" y="788" text-anchor="middle" class="label">Outbound mail (RT notifications)</text>
  <text x="460" y="806" text-anchor="middle" class="mono">rt5 --msmtp--&gt; exim:25 (rt5-net) --SMTP--&gt; smtp.example.com</text>
</svg>
